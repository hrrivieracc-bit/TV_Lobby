  .stage{width:100vw;height:100vh;display:grid;grid-template-rows:15vh 1fr 9vh;position:relative;}
  .stage::before{content:"";position:absolute;inset:1.4vh 1.4vw;border:1px solid rgba(226,200,128,.34);pointer-events:none;}

  header{display:flex;align-items:center;justify-content:space-between;padding:0 4vw;position:relative;
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);}
  header::after{content:"";position:absolute;left:4vw;right:4vw;bottom:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(226,200,128,.6) 12%,rgba(226,200,128,.6) 88%,transparent);}
  .brand{display:flex;align-items:center;gap:1.6vw;}
  .crest{height:10vh;width:auto;filter:drop-shadow(0 .3vh .6vh rgba(0,0,0,.5));}
  .name{font-family:var(--serif);font-weight:600;font-size:2.5vw;line-height:.98;}
  .name b{color:var(--gold-soft);font-weight:600;}
  .sub{margin-top:.6vh;font-size:.82vw;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);font-weight:700;}
  .clock{text-align:right;}
  .clock .time{font-family:var(--serif);font-weight:500;font-size:3.6vw;line-height:.9;}
  .clock .time .ampm{font-size:1.2vw;color:var(--gold);margin-left:.4vw;}
  .clock .date{margin-top:.4vh;font-size:.92vw;letter-spacing:.26em;text-transform:uppercase;color:var(--ivory-dim);}
  .name,.sub,.clock .time,.clock .date{text-shadow:0 1px 3px rgba(0,0,0,.62);}

  main{display:grid;grid-template-columns:1.08fr 1fr;gap:2.8vw;padding:2.8vh 4vw 2.2vh;min-height:0;}
  .col{display:flex;flex-direction:column;min-height:0;}
  .plabel{font-size:.88vw;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);font-weight:700;
    display:flex;align-items:center;gap:1vw;flex:none;text-shadow:0 1px 3px rgba(0,0,0,.62);}
  .plabel::after{content:"";flex:1;height:1px;background:var(--line);}
  .plabel svg{width:1.15vw;height:1.15vw;flex:none;}

  /* ── El partido ── */
  .match{flex:1;min-height:0;margin-top:1.6vh;display:flex;flex-direction:column;
    background:var(--panel);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
    border:1px solid var(--line);border-radius:.6vw;padding:2.4vh 2vw;}
  .m-round{font-family:var(--serif);font-weight:700;font-size:2.5vw;color:var(--gold-soft);line-height:1;flex:none;}
  .m-when{margin-top:.7vh;font-size:1vw;letter-spacing:.2em;text-transform:uppercase;color:var(--ivory-dim);font-weight:600;flex:none;}
  .teams{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:1.4vh;}
  .team{display:grid;grid-template-columns:5.6vw 1fr auto;align-items:center;gap:1.4vw;}
  .team .flag{width:5.6vw;height:3.7vw;object-fit:cover;border-radius:.25vw;
    box-shadow:0 .2vh .8vh rgba(0,0,0,.55);background:rgba(255,255,255,.08);}
  .team .tn{font-family:var(--serif);font-weight:600;font-size:2.9vw;line-height:1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .team .sc{font-family:var(--serif);font-weight:700;font-size:3.4vw;line-height:1;color:var(--gold-soft);min-width:2.4vw;text-align:right;}
  .team.lost .tn,.team.lost .sc{opacity:.55;}
  .team.won .sc{color:#7FD9A8;}
  .m-state{flex:none;margin-top:1.6vh;display:flex;align-items:center;justify-content:center;gap:1vw;
    border-top:1px solid var(--line);padding-top:1.6vh;}
  .chip{font-size:1vw;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
    padding:.7vh 1.4vw;border-radius:2vw;border:1px solid var(--line);color:var(--ivory-dim);}
  .chip.live{background:var(--maroon);border-color:var(--maroon);color:#fff;animation:pulse 2s ease-in-out infinite;}
  .chip.final{border-color:rgba(226,200,128,.5);color:var(--gold-soft);}
  .chip.count{border-color:rgba(226,200,128,.5);color:var(--gold-soft);font-family:var(--serif);
    font-size:1.5vw;letter-spacing:.06em;text-transform:none;font-weight:700;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.62}}
  @media (prefers-reduced-motion:reduce){.chip.live{animation:none}}

  /* ── La info del club ── */
  .party{flex:1;min-height:0;margin-top:1.6vh;display:flex;flex-direction:column;
    background:linear-gradient(180deg,rgba(9,24,40,.70),rgba(9,24,40,.52));
    -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
    border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:.6vw;padding:2.4vh 2vw;}
  .p-title{font-family:var(--serif);font-weight:600;font-size:2.5vw;line-height:1.05;flex:none;}
  .p-when{margin-top:.8vh;font-size:1.05vw;font-weight:600;color:var(--gold-soft);letter-spacing:.04em;flex:none;}
  .p-body{flex:1;min-height:0;overflow:hidden;margin-top:1.8vh;}
  .p-body p{font-family:var(--serif);font-size:1.18vw;line-height:1.5;color:var(--ivory);margin-bottom:1vh;}
  .p-body p:last-child{margin-bottom:0;}
  .p-notice{flex:none;font-family:var(--serif);font-weight:600;font-size:1.14vw;line-height:1.4;color:#F0A99D;margin-top:1.2vh;}
  .p-rsvp{flex:none;margin-top:1.6vh;padding-top:1.4vh;border-top:1px solid var(--line);
    display:flex;align-items:center;gap:1vw;font-size:1.05vw;font-weight:700;letter-spacing:.16em;
    text-transform:uppercase;color:var(--gold-soft);}
  .p-rsvp::before{content:"";width:2vw;height:2px;background:var(--gold);flex:none;}

  footer{background:rgba(8,22,38,.92);border-top:1px solid rgba(226,200,128,.2);display:flex;align-items:center;overflow:hidden;
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);}
  .tk-tag{flex:none;align-self:stretch;display:flex;align-items:center;padding:0 1.8vw;background:var(--gold);
    color:var(--navy-deep);font-weight:700;font-size:1vw;letter-spacing:.2em;text-transform:uppercase;
    clip-path:polygon(0 0,100% 0,calc(100% - 1.6vh) 100%,0 100%);}
  .tk-wrap{flex:1;overflow:hidden;white-space:nowrap;}
  .tk-track{display:inline-block;white-space:nowrap;padding-left:100%;animation:tk 60s linear infinite;}
  .tk-track span{font-size:1.3vw;color:var(--ivory);font-weight:500;}
  .tk-track .sep{color:var(--gold);margin:0 1.5vw;}
  @keyframes tk{from{transform:translateX(0)}to{transform:translateX(-100%)}}
  @media (prefers-reduced-motion:reduce){.tk-track{animation-duration:130s}}
</style>
</head>
<body>
  <div class="stage">

      <div class="clock">

    <main>
      <section class="col">
        <div class="plabel"><svg viewBox="0 0 24 24" fill="none" stroke="#E2C880" stroke-width="1.9"><circle cx="12" cy="12" r="9"/><path d="M12 7.2l3.9 2.8-1.5 4.6h-4.8L8.1 10z" stroke-linejoin="round"/><path d="M12 3v4.2M4.4 9.2l3.7.8M19.6 9.2l-3.7.8M7.3 19.6l2.3-4.9M16.7 19.6l-2.3-4.9"/></svg>The Match</div>

          <div class="m-state"><span class="chip" id="mChip">—</span></div>
        </div>
      </section>

      <section class="col">
        <div class="plabel"><svg viewBox="0 0 24 24" fill="none" stroke="#E2C880" stroke-width="1.9" stroke-linecap="round"><path d="M4 20.5V9.8L12 3.5l8 6.3v10.7z" stroke-linejoin="round"/><path d="M9.5 20.5v-6h5v6"/></svg><span id="pLabel">At the Club</span></div>
        <div class="party">
          <div class="p-title" id="pTitle"></div>
          <div class="p-when" id="pWhen"></div>
          <div class="p-body" id="pBody"></div>
          <div class="p-notice" id="pNotice"></div>
          <div class="p-rsvp" id="pRsvp"></div>
        </div>
      </section>

    <footer>
      <div class="tk-tag">⚽ Riviera</div>
      <div class="tk-wrap"><div class="tk-track" id="ticker"><span>Riviera Country Club</span></div></div>
    </footer>
  </div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   ↓↓↓  LA INFO DEL CLUB — EDITA SOLO ESTO  ↓↓↓
   ══════════════════════════════════════════════════════════════════════════ */
const PARTY = {
  label   : "At the Club",
  title   : "World Cup Final Watch Party",
  when    : "Sunday, July 19 · 3:00 PM · The Founder's Lounge",
  body    : [
    "Members are invited to view the World Cup Final in The Founder's Lounge beginning at 3:00 PM. The game will display on the projector screens located in the Upper Clubhouse.",
    "Enjoy beer bucket specials and complimentary buffet from 2:30 to 5:00 PM, including wings, meatballs, cheeses, charcuterie, and crudités."
  ],
  notice  : "Members only, no guests please. To-go service will not be available.",
  rsvp    : "RSVP · (305) 661-5331",
  ticker  : [
    "World Cup Final · Sunday, July 19 at 3:00 PM · The Founder's Lounge",
    "Complimentary buffet and beer bucket specials from 2:30 to 5:00 PM",
    "Members only, no guests please · To-go service will not be available",
    "RSVP by calling the Club at (305) 661-5331"
  ]
};

/* Partido de respaldo si ESPN no responde. Verificado el 17 de julio de 2026:
   España llegó ganándole a Francia 2-0; Argentina a Inglaterra 2-1. */
const FALLBACK = {
  round:'Final', kickoff:'2026-07-19T19:00:00Z',
  home:{name:'Spain',     flag:'https://a.espncdn.com/i/teamlogos/countries/500/esp.png', score:null},
  away:{name:'Argentina', flag:'https://a.espncdn.com/i/teamlogos/countries/500/arg.png', score:null},
  state:'pre', detail:''
};
/* ══════════════════════════ fin de la zona editable ══════════════════════ */

const TZ='America/New_York';
const ESPN='https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?dates=20260611-20260719&limit=200';
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ── Pintar la info del club ── */
document.getElementById('pLabel').textContent=PARTY.label||'At the Club';
document.getElementById('pTitle').textContent=PARTY.title||'';
document.getElementById('pWhen').textContent=PARTY.when||'';
document.getElementById('pBody').innerHTML=(PARTY.body||[]).map(p=>'<p>'+esc(p)+'</p>').join('');
const pn=document.getElementById('pNotice'); pn.textContent=PARTY.notice||''; if(!PARTY.notice)pn.style.display='none';
const pr=document.getElementById('pRsvp'); pr.textContent=PARTY.rsvp||''; if(!PARTY.rsvp)pr.style.display='none';
(function(){
  const tk=document.getElementById('ticker');
  tk.innerHTML=(PARTY.ticker||[]).map(t=>'<span>'+esc(t)+'</span>').join('<span class="sep">◆</span>')
    ||'<span>Riviera Country Club</span>';
  tk.style.animationDuration=Math.max(45,Math.round((tk.scrollWidth||3000)/80))+'s';
})();

/* ── Reloj ── */
function tick(){
  const n=new Date();
  const p=new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit',hour12:true,timeZone:TZ}).formatToParts(n);
  let hm='',ap=''; for(const x of p){ if(['hour','minute','literal'].includes(x.type))hm+=x.value; if(x.type==='dayPeriod')ap=x.value; }
  document.getElementById('tHour').textContent=hm.trim();
  document.getElementById('tAmPm').textContent=ap;
  document.getElementById('tDate').textContent=new Intl.DateTimeFormat('en-US',{weekday:'short',month:'short',day:'numeric',timeZone:TZ}).format(n);
}
tick(); setInterval(tick,15000);

/* ── Cuenta regresiva legible ── */
function countdown(ms){
  if(ms<=0) return 'Kicking off';
  const m=Math.floor(ms/60000), h=Math.floor(m/60), d=Math.floor(h/24);
  if(d>=1)  return 'In '+d+(d===1?' day':' days');
  if(h>=1)  return 'In '+h+(h===1?' hour':' hours');
  return 'In '+Math.max(1,m)+(m===1?' minute':' minutes');
}

/* ── El partido ── */
let match=Object.assign({},FALLBACK);
function renderMatch(){
  const ko=new Date(match.kickoff);
  document.getElementById('mRound').textContent=match.round||'Final';
  document.getElementById('mWhen').textContent=
    new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',timeZone:TZ}).format(ko)
    +' · '+new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit',hour12:true,timeZone:TZ}).format(ko);

  const live = match.state==='in', done = match.state==='post';
  const hs=match.home.score, as=match.away.score;
  const show = live||done;
  const cls=(me,other)=> done && me!=null && other!=null ? (me>other?' won':(me<other?' lost':'')) : '';
  document.getElementById('mTeams').innerHTML=[match.home,match.away].map((t,i)=>{
    const me=i===0?hs:as, other=i===0?as:hs;
    return `<div class="team${cls(me,other)}">
      <img class="flag" src="${esc(t.flag)}" alt="" onerror="this.style.visibility='hidden'">
      <span class="tn">${esc(t.name)}</span>
      <span class="sc">${show&&me!=null?esc(String(me)):'&nbsp;'}</span>
    </div>`;
  }).join('');

  const chip=document.getElementById('mChip');
  if(live){ chip.className='chip live'; chip.textContent=match.detail||'Live'; }
  else if(done){ chip.className='chip final'; chip.textContent='Full Time'; }
  else { chip.className='chip count'; chip.textContent=countdown(ko-new Date()); }
}
function pickFinal(events){
  // 1) el que ESPN marque como final;  2) si no, el último por fecha
  let best=null;
  for(const ev of (events||[])){
    const c=(ev.competitions||[])[0]||{};
    const note=((c.notes||[])[0]||{}).headline||c.altGameNote||ev.name||'';
    const isFinal=/final/i.test(note) && !/semi|quarter|third|3rd/i.test(note);
    const t=new Date(ev.date).getTime();
    if(isFinal && (!best||t>new Date(best.date).getTime())) best=ev;
  }
  if(best) return best;
  let last=null;
  for(const ev of (events||[])) if(!last||new Date(ev.date)>new Date(last.date)) last=ev;
  return last;
}
async function loadMatch(){
  try{
    const c=new AbortController(); const to=setTimeout(()=>c.abort(),9000);
    const r=await fetch(ESPN+'&_='+Date.now(),{signal:c.signal}); clearTimeout(to);
    const d=await r.json();
    const ev=pickFinal(d.events);
    if(!ev) return;
    const comp=(ev.competitions||[])[0]||{};
    const cs=(comp.competitors||[]).slice().sort((a,b)=>(a.homeAway==='home'?0:1)-(b.homeAway==='home'?0:1));
    if(cs.length<2) return;
    const mk=x=>({name:(x.team||{}).displayName||'', flag:(x.team||{}).logo||'',
                  score:(x.score===''||x.score==null)?null:Number(x.score)});
    const st=((comp.status||{}).type)||{};
    match={ round:'Final', kickoff:ev.date,
            home:mk(cs[0]), away:mk(cs[1]),
            state:st.state||'pre', detail:st.detail||st.shortDetail||'' };
  }catch(e){ /* se queda el respaldo */ }
  renderMatch();
}
renderMatch();
loadMatch();
setInterval(loadMatch,60*1000);   // en vivo: refresca cada minuto
setInterval(renderMatch,60*1000); // la cuenta regresiva baja sola

/* Auto-reload cada 6 h */
setTimeout(()=>location.reload(),6*60*60*1000);
</script>
