   · Leaderboard PGA Tour (ESPN site API, JSON directo con CORS — mismo API confiable, sin proxies RSS)
   · Golf headlines (ESPN news API, JSON directo — reemplaza los RSS que fallaban)
   · Mercados: S&P 500 (SPY), Dow Jones (DIA), Nasdaq 100 (QQQ)

<style>
  :root{
    --navy:#13315C; --navy-deep:#0E2547; --navy-line:#1C3E6E;
    --gold:#C7A23C; --gold-soft:#E2C880; --maroon:#7E2A34;
    --ivory:#F3EFE5; --ivory-dim:#C3CCDA; --green:#2E7D5B;
    --up:#6FCB99; --down:#E58B7E;
    --serif:'Source Serif 4',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--navy);}
  body{font-family:var(--sans);color:var(--ivory);font-size:1.05vw;-webkit-font-smoothing:antialiased;
    background:radial-gradient(120% 90% at 80% -10%,#1a4079 0,rgba(26,64,121,0) 55%),
      radial-gradient(140% 120% at -10% 120%,#102d57 0,rgba(16,45,87,0) 50%),var(--navy);}
  .stage{width:100vw;height:100vh;display:grid;grid-template-rows:15vh 1fr 9vh;position:relative;}
  .stage::before{content:"";position:absolute;inset:1.4vh 1.4vw;border:1px solid rgba(199,162,60,.28);pointer-events:none;}

  header{display:flex;align-items:center;justify-content:space-between;padding:0 4vw;position:relative;}
  header::after{content:"";position:absolute;left:4vw;right:4vw;bottom:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(199,162,60,.6) 12%,rgba(199,162,60,.6) 88%,transparent);}
  .brand{display:flex;align-items:center;gap:1.6vw;}
  .crest{height:10vh;width:auto;filter:drop-shadow(0 .3vh .6vh rgba(0,0,0,.45));}
  .crest-fb{height:10vh;width:7.5vh;border:1.5px solid var(--gold);border-radius:0 0 50% 50%/0 0 22% 22%;
    display:none;align-items:center;justify-content:center;color:var(--gold);font-family:var(--serif);font-weight:700;font-size:2.8vh;}
  .name{font-family:var(--serif);font-weight:600;font-size:3.3vw;line-height:.95;}
  .name b{color:var(--gold-soft);font-weight:600;}
  .loc{margin-top:.5vh;font-size:.9vw;letter-spacing:.42em;text-transform:uppercase;color:var(--gold);font-weight:600;}
  .clock{text-align:right;}
  .clock .time{font-family:var(--serif);font-weight:500;font-size:4.2vw;line-height:.9;}
  .clock .time .ampm{font-size:1.4vw;color:var(--gold);margin-left:.4vw;}
  .clock .date{margin-top:.4vh;font-size:1vw;letter-spacing:.26em;text-transform:uppercase;color:var(--ivory-dim);}

  main{display:grid;grid-template-columns:1.05fr 1fr;gap:2.8vw;padding:3vh 4vw 2.2vh;min-height:0;}
  .panel-label{font-size:.9vw;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);font-weight:700;display:flex;align-items:center;gap:1vw;}
  .panel-label::after{content:"";flex:1;height:1px;background:var(--navy-line);}

  /* ==== Columna izquierda: Clima + Mercados ==== */
  .lcol{display:flex;flex-direction:column;min-height:0;gap:2.4vh;}
  .weather{flex:1;display:flex;flex-direction:column;min-height:0;}
  .wx-now{display:flex;align-items:center;gap:2vw;margin-top:1.8vh;}
  .wx-icon{width:10.5vh;height:10.5vh;flex:none;}
  .wx-temp{font-family:var(--serif);font-weight:600;font-size:7vw;line-height:.82;}
  .wx-temp .deg{color:var(--gold);}
  .wx-cond .desc{font-size:1.35vw;font-weight:600;}
  .wx-cond .feels{font-size:1vw;color:var(--ivory-dim);margin-top:.5vh;}
  .wx-stats{display:flex;gap:2.4vw;margin-top:2.2vh;}
  .wx-stat .k{font-size:.78vw;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;}
  .wx-stat .v{font-size:1.5vw;font-weight:600;margin-top:.3vh;font-family:var(--serif);}
  .wx-fc{margin-top:auto;display:flex;gap:1.1vw;padding-top:2.2vh;}
  .fc-cell{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--navy-line);border-radius:.5vw;padding:1.1vh 1vw;text-align:center;}
  .fc-cell .fc-t{font-size:.8vw;letter-spacing:.14em;text-transform:uppercase;color:var(--ivory-dim);font-weight:600;}
  .fc-cell .fc-i{width:4.4vh;height:4.4vh;margin:.7vh auto .5vh;}
  .fc-cell .fc-d{font-size:1.35vw;font-weight:600;font-family:var(--serif);}

  /* Mercados */
  .mkt-head{display:flex;align-items:center;justify-content:space-between;}
  .mkt-chip{display:flex;align-items:center;gap:.5vw;font-size:.72vw;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--ivory-dim);}
  .mkt-chip .dot{width:.55vw;height:.55vw;border-radius:50%;background:var(--ivory-dim);}
  .mkt-chip.open{color:var(--up);} .mkt-chip.open .dot{background:var(--up);box-shadow:0 0 .6vw rgba(111,203,153,.7);}
  .mkt-grid{margin-top:1.3vh;display:grid;grid-template-columns:repeat(3,1fr);gap:1.1vw;}
  .mkt-tile{background:rgba(255,255,255,.04);border:1px solid var(--navy-line);border-radius:.5vw;padding:1.2vh 1.1vw;}
  .mkt-tile .lbl{font-size:.78vw;letter-spacing:.14em;text-transform:uppercase;color:var(--ivory-dim);font-weight:600;white-space:nowrap;}
  .mkt-tile .lbl b{color:var(--gold);font-weight:700;}
  .mkt-tile .px{font-family:var(--serif);font-weight:700;font-size:1.8vw;margin-top:.5vh;line-height:1;}
  .mkt-tile .chg{font-size:.95vw;font-weight:600;margin-top:.5vh;white-space:nowrap;}
  .chg.up{color:var(--up);} .chg.down{color:var(--down);} .chg.flat{color:var(--ivory-dim);}
  .mkt-tile .tag{display:inline-block;margin-top:.7vh;font-size:.62vw;letter-spacing:.16em;font-weight:700;text-transform:uppercase;
    color:var(--gold);border:1px solid rgba(199,162,60,.45);border-radius:1vw;padding:.25vh .65vw;}
  .plabel-ico{width:1.2vw;height:1.2vw;flex:none;}

  /* ==== Columna derecha: Leaderboard PGA + Golf headlines ==== */
  .rcol{display:flex;flex-direction:column;min-height:0;gap:2.2vh;}
  .golf{display:flex;flex-direction:column;min-height:0;}
  .g-sub{display:flex;align-items:center;gap:.9vw;margin-top:1vh;font-size:.82vw;letter-spacing:.16em;text-transform:uppercase;color:var(--ivory-dim);font-weight:600;min-height:2.2vh;}
  .g-sub .tname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%;}
  .g-status{font-size:.72vw;font-weight:700;letter-spacing:.08em;padding:.25vh .7vw;border-radius:1vw;text-transform:uppercase;}
  .g-status.live{color:#fff;background:var(--maroon);}
  .g-status.final{color:var(--ivory-dim);border:1px solid var(--navy-line);}
  .g-status.next{color:var(--gold);border:1px solid rgba(199,162,60,.5);}
  .lb-list{margin-top:1.2vh;display:flex;flex-direction:column;gap:.5vh;overflow:hidden;}
  .lb-row{display:grid;grid-template-columns:3vw 2vw 1fr auto;align-items:center;gap:.9vw;
    background:rgba(255,255,255,.035);border:1px solid var(--navy-line);border-radius:.45vw;padding:.75vh 1.1vw;}
  .lb-row.leader{border-left:3px solid var(--gold);}
  .lb-row .pos{font-family:var(--serif);font-weight:700;font-size:1.15vw;color:var(--gold-soft);text-align:center;}
  .lb-row .flag{width:1.7vw;height:1.15vw;object-fit:cover;border-radius:.15vw;box-shadow:0 0 .3vh rgba(0,0,0,.5);}
  .lb-row .plr{font-size:1.12vw;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lb-row .tot{font-family:var(--serif);font-weight:700;font-size:1.35vw;white-space:nowrap;}
  .tot.under{color:var(--up);} .tot.over{color:var(--down);} .tot.even{color:var(--ivory-dim);}
  .lb-empty{margin-top:1.4vh;font-size:1.05vw;color:var(--ivory-dim);font-style:italic;line-height:1.5;}
  .lb-empty b{color:var(--gold-soft);font-style:normal;}

  /* Golf headlines */
  .news{flex:1;display:flex;flex-direction:column;min-height:0;}
  .nw-card{margin-top:1.2vh;flex:1;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
    border:1px solid var(--navy-line);border-left:3px solid var(--gold);border-radius:.5vw;padding:2vh 1.8vw;
    display:flex;flex-direction:column;justify-content:flex-start;min-height:0;transition:opacity .5s;}
  .nw-card.fade{opacity:0;}
  .nw-src{font-size:.82vw;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700;flex:none;}
  .nw-hl{font-family:var(--serif);font-weight:600;font-size:1.55vw;line-height:1.18;margin-top:.9vh;flex:none;}
  .nw-sumwrap{flex:1;min-height:0;overflow:hidden;margin-top:1vh;}
  .nw-sum{font-size:1.05vw;line-height:1.5;color:var(--ivory-dim);will-change:transform;}

  /* Ticker */
  footer{background:var(--navy-deep);border-top:1px solid var(--navy-line);display:flex;align-items:center;overflow:hidden;}
  .tk-tag{flex:none;align-self:stretch;display:flex;align-items:center;gap:.8vw;padding:0 1.8vw;background:var(--gold);color:var(--navy-deep);
    font-weight:700;font-size:1vw;letter-spacing:.2em;text-transform:uppercase;clip-path:polygon(0 0,100% 0,calc(100% - 1.6vh) 100%,0 100%);}
  .tk-wrap{flex:1;overflow:hidden;white-space:nowrap;}
  .tk-track{display:inline-block;white-space:nowrap;padding-left:100%;animation:ticker 60s linear infinite;}
  .tk-track span{font-size:1.35vw;color:var(--ivory);font-weight:500;}
  .tk-track .sep{color:var(--gold);margin:0 1.5vw;}
  .tk-track .up{color:var(--up);} .tk-track .down{color:var(--down);}
  @keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-100%)}}
  @media (prefers-reduced-motion:reduce){.tk-track{animation-duration:120s;}}
</style>
</head>

<script>
/* ===================== CONFIG ===================== */
const LAT=25.7304, LON=-80.2860, TZ='America/New_York';
const TOUR='pga';                // 'pga' o 'lpga'
const FINNHUB_KEY='';            // <-- pega aquí tu API key gratis de https://finnhub.io/register (mercados más confiables)
const MARKETS=[
  {sym:'SPY', label:'S&P 500'},
  {sym:'DIA', label:'Dow Jones'},
  {sym:'QQQ', label:'Nasdaq 100'}
];
const LB_ROWS=6;                 // jugadores visibles en el leaderboard
const ROTATE_MS=9000;            // rotación de la tarjeta de noticias
const TICKER_PXPS=80;            // velocidad del ticker (px/seg)
const PROXIES=['https://api.allorigins.win/raw?url=','https://corsproxy.io/?url=','https://api.codetabs.com/v1/proxy?quest='];

/* ===================== UTILIDADES ===================== */
function fetchT(url,ms){ // fetch con timeout: un proxy colgado no congela el módulo
  const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms||8000);
  return fetch(url,{signal:c.signal}).finally(()=>clearTimeout(t));
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function stripHTML(s){const d=document.createElement('div');d.innerHTML=s||'';let t=d.textContent||'';return t.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();}
function cleanSum(s,title){s=stripHTML(s);if(!s)return '';if(title&&s.slice(0,30).toLowerCase()===title.slice(0,30).toLowerCase())s=s.slice(title.length).trim();return s.length>200?s.slice(0,197).trim()+'\u2026':s;}

/* ===================== RELOJ ===================== */
function tick(){
  const now=new Date();
  const p=new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit',hour12:true,timeZone:TZ}).formatToParts(now);
  let hm='',ap=''; for(const x of p){ if(['hour','minute','literal'].includes(x.type)) hm+=x.value; if(x.type==='dayPeriod') ap=x.value; }
  document.getElementById('tHour').textContent=hm.trim();
  document.getElementById('tAmPm').textContent=ap;
  document.getElementById('tDate').textContent=new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',timeZone:TZ}).format(now);
}
tick(); setInterval(tick,15000);

/* ===================== ICONOS CLIMA ===================== */
function wxGroup(c){if(c===0)return'sun';if(c===1||c===2)return'partly';if(c===3||c===45||c===48)return'cloud';
  if((c>=51&&c<=67)||(c>=80&&c<=82))return'rain';if(c>=71&&c<=77)return'cloud';if(c>=95)return'storm';return'cloud';}
function wxLabel(c){const m={0:'Clear',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Fog',51:'Light drizzle',53:'Drizzle',55:'Drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',66:'Freezing rain',67:'Freezing rain',71:'Snow',73:'Snow',75:'Snow',77:'Snow',80:'Rain showers',81:'Rain showers',82:'Heavy showers',85:'Snow',86:'Snow',95:'Thunderstorm',96:'Thunderstorm',99:'Thunderstorm'};return m[c]||'—';}
function wxSVG(g,s){const sun=`<circle cx="22" cy="22" r="9" fill="#E2C880"/>`+[...Array(8)].map((_,i)=>{const a=i*Math.PI/4;return `<line x1="${(22+Math.cos(a)*15).toFixed(1)}" y1="${(22+Math.sin(a)*15).toFixed(1)}" x2="${(22+Math.cos(a)*19).toFixed(1)}" y2="${(22+Math.sin(a)*19).toFixed(1)}" stroke="#E2C880" stroke-width="2" stroke-linecap="round"/>`}).join('');
  const cloud=`<path d="M14 30 a8 8 0 0 1 1-15 a11 11 0 0 1 21 3 a7 7 0 0 1 -1 12 z" fill="#cfd8e6"/>`;
  const sh={sun:`<svg viewBox="0 0 44 44" width="${s}" height="${s}">${sun}</svg>`,
    partly:`<svg viewBox="0 0 44 44" width="${s}" height="${s}"><circle cx="16" cy="15" r="7" fill="#E2C880"/>${cloud}</svg>`,
    cloud:`<svg viewBox="0 0 44 44" width="${s}" height="${s}">${cloud}</svg>`,
    rain:`<svg viewBox="0 0 44 44" width="${s}" height="${s}">${cloud}<g stroke="#E2C880" stroke-width="2" stroke-linecap="round"><line x1="16" y1="34" x2="14" y2="39"/><line x1="23" y1="34" x2="21" y2="39"/><line x1="30" y1="34" x2="28" y2="39"/></g></svg>`,
    storm:`<svg viewBox="0 0 44 44" width="${s}" height="${s}">${cloud}<path d="M22 32 l-4 6 h4 l-3 6" stroke="#E2C880" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`};
  return sh[g]||sh.cloud;}

/* ===================== CLIMA (Open-Meteo) ===================== */
async function loadWeather(){
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=${encodeURIComponent(TZ)}&forecast_days=1`;
  try{const r=await fetch(url),d=await r.json(),c=d.current;
    document.getElementById('wxTemp').textContent=Math.round(c.temperature_2m);
    document.getElementById('wxDesc').textContent=wxLabel(c.weather_code);
    document.getElementById('wxFeels').textContent='Feels like '+Math.round(c.apparent_temperature)+'°';
    document.getElementById('wxHum').textContent=Math.round(c.relative_humidity_2m)+'%';
    document.getElementById('wxWind').textContent=Math.round(c.wind_speed_10m)+' mph';
    document.getElementById('wxHi').textContent=Math.round(d.daily.temperature_2m_max[0])+'°';
    document.getElementById('wxLo').textContent=Math.round(d.daily.temperature_2m_min[0])+'°';
    document.getElementById('wxIcon').innerHTML=wxSVG(wxGroup(c.weather_code),'100%');
    const T=d.hourly.time,P=d.hourly.temperature_2m,C=d.hourly.weather_code; let i=T.findIndex(t=>new Date(t)>new Date()); if(i<0)i=0;
    let cells=''; for(let k=0;k<3;k++){const j=Math.min(i+1+k*2,T.length-1);const hr=new Intl.DateTimeFormat('en-US',{hour:'numeric',hour12:true,timeZone:TZ}).format(new Date(T[j]));
      cells+=`<div class="fc-cell"><div class="fc-t">${hr}</div><div class="fc-i">${wxSVG(wxGroup(C[j]),'100%')}</div><div class="fc-d">${Math.round(P[j])}°</div></div>`;}
    document.getElementById('wxForecast').innerHTML=cells;
  }catch(e){document.getElementById('wxDesc').textContent='Weather unavailable';document.getElementById('wxIcon').innerHTML=wxSVG('cloud','100%');}
}
loadWeather(); setInterval(loadWeather,10*60*1000);

/* ===================== LEADERBOARD PGA (ESPN, JSON directo) ===================== */
const ESPN_GOLF=`https://site.api.espn.com/apis/site/v2/sports/golf/${TOUR}/scoreboard`;
function scoreClass(s){ s=(s||'').trim(); if(s.charAt(0)==='-')return 'under'; if(s.charAt(0)==='+')return 'over'; return 'even'; }
function pickEvent(events){
  const now=Date.now(), PAD=30*36e5; // ~30h de gracia tras terminar
  let live=null, recent=null, upcoming=null;
  for(const ev of (events||[])){
    const s=new Date(ev.date).getTime(), e=new Date(ev.endDate||ev.date).getTime()+PAD;
    if(now>=s && now<=e){ if(!live||s>new Date(live.date).getTime()) live=ev; }
    else if(e<now){ if(!recent||e>new Date(recent.endDate||recent.date).getTime()+PAD) recent=ev; }
    else { if(!upcoming||s<new Date(upcoming.date).getTime()) upcoming=ev; }
  }
  return live||recent||upcoming||null;
}
function eventPhase(ev){
  const st=(((ev.status||{}).type)||{}).state;
  if(st==='in')return 'live'; if(st==='post')return 'final'; if(st==='pre')return 'next';
  const now=Date.now(), s=new Date(ev.date).getTime(), e=new Date(ev.endDate||ev.date).getTime()+30*36e5;
  if(now<s)return 'next'; if(now>e)return 'final'; return 'live';
}
async function loadGolf(){
  const nameEl=document.getElementById('gName'), stEl=document.getElementById('gStatus'), list=document.getElementById('lbList');
  try{
    const r=await fetch(`${ESPN_GOLF}?_=${Date.now()}`); const d=await r.json();
    const ev=pickEvent(d.events);
    if(!ev){ nameEl.textContent='PGA Tour'; stEl.style.display='none';
      list.innerHTML='<div class="lb-empty">No tournament data available right now.</div>'; return; }
    const phase=eventPhase(ev);
    nameEl.textContent=ev.name||ev.shortName||'PGA Tour';
    stEl.style.display='inline-block';
    stEl.className='g-status '+phase;
    stEl.textContent= phase==='live'?'Live': phase==='final'?'Final':
      new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',timeZone:TZ}).format(new Date(ev.date));
    const comps=(((ev.competitions||[])[0]||{}).competitors||[]).slice().sort((a,b)=>(a.order||99)-(b.order||99));
    if(phase==='next'||!comps.length||comps.every(c=>!(c.score&&c.score!==''))){
      const dt=new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',timeZone:TZ}).format(new Date(ev.date));
      list.innerHTML=`<div class="lb-empty">Next tournament: <b>${esc(ev.name||'')}</b><br>Starts ${esc(dt)}</div>`;
      return;
    }
    // posiciones con empates (T)
    const pos=[], cnt={}; let lastScore=null,lastPos=0;
    comps.forEach((c,i)=>{ const sc=(c.score||'').trim();
      if(sc!==''&&sc===lastScore){ pos.push(lastPos); } else { pos.push(i+1); lastPos=i+1; lastScore=sc; }
      cnt[pos[i]]=(cnt[pos[i]]||0)+1; });
    list.innerHTML=comps.slice(0,LB_ROWS).map((c,i)=>{
      const a=c.athlete||{}, sc=(c.score||'—').trim();
      const p=(cnt[pos[i]]>1?'T':'')+pos[i];
      const flag=(a.flag&&a.flag.href)?`<img class="flag" src="${esc(a.flag.href)}" alt="">`:'<span></span>';
      return `<div class="lb-row${i===0?' leader':''}">
        <span class="pos">${esc(String(p))}</span>${flag}
        <span class="plr">${esc(a.displayName||a.fullName||'')}</span>
        <span class="tot ${scoreClass(sc)}">${esc(sc)}</span>
      </div>`;
    }).join('');
  }catch(e){
    nameEl.textContent='PGA Tour'; stEl.style.display='none';
    list.innerHTML='<div class="lb-empty">Leaderboard unavailable. Retrying…</div>';
  }
}
loadGolf(); setInterval(loadGolf,5*60*1000);

/* ===================== GOLF HEADLINES (ESPN news, JSON directo) ===================== */
async function espnNews(tour,label){
  const r=await fetch(`https://site.api.espn.com/apis/site/v2/sports/golf/${tour}/news?limit=12&_=${Date.now()}`);
  const d=await r.json();
  return (d.articles||[]).map(a=>({title:stripHTML(a.headline||''),sum:cleanSum(a.description||'',a.headline||''),src:label}))
    .filter(x=>x.title);
}
/* Respaldo de emergencia: Google News RSS de golf vía proxy (solo si ESPN falla) */
async function rssBackup(){
  const feed='https://news.google.com/rss/search?q=golf+PGA&hl=en-US&gl=US&ceid=US:en';
  for(const p of PROXIES){
    try{
      const r=await fetch(p+encodeURIComponent(feed)); let txt=await r.text();
      if(txt.trim().charAt(0)==='{'){try{const jj=JSON.parse(txt);txt=jj.contents||txt;}catch(e){}}
      const xml=new DOMParser().parseFromString(txt,'text/xml');
      const items=[...xml.querySelectorAll('item')].slice(0,10).map(it=>{const t=stripHTML(it.querySelector('title')?.textContent);
        return {title:t,sum:'',src:'Golf'};}).filter(x=>x.title);
      if(items.length)return items;
    }catch(e){}
  }
  return null;
}
async function fetchNews(){
  let items=[];
  try{ items=items.concat(await espnNews(TOUR,TOUR.toUpperCase()+' Tour')); }catch(e){}
  try{ if(items.length<10) items=items.concat((await espnNews(TOUR==='pga'?'lpga':'pga', TOUR==='pga'?'LPGA':'PGA Tour')).slice(0,4)); }catch(e){}
  if(!items.length){ const bk=await rssBackup(); if(bk)items=bk; }
  return items.length?items.slice(0,12):null;
}

const FALLBACK=[
  {title:'Welcome to Riviera Country Club',sum:'Coral Gables \u00b7 Established 1945 \u00b7 A one-of-a-kind family club.',src:'Riviera Country Club'},
  {title:'Golf headlines refresh throughout the day',sum:'The latest from the PGA Tour and the world of golf.',src:'Golf'}
];
let news=FALLBACK.slice(), ni=0, rotTimer=null, mktTicker=[];
const READ_PXPS=14;   // velocidad del auto-scroll del resumen (px/seg, ritmo de lectura)
const READ_DELAY=2500; // pausa antes de empezar a desplazar (ms)
function renderNews(){
  const h=news[((ni%news.length)+news.length)%news.length], card=document.getElementById('nwCard');
  if(rotTimer)clearTimeout(rotTimer);
  card.classList.add('fade');
  setTimeout(()=>{
    const sum=document.getElementById('nwSum'), wrap=sum.parentElement;
    document.getElementById('nwSrc').textContent=(h.src||'Golf').toUpperCase();
    document.getElementById('nwHl').textContent=h.title;
    sum.style.transition='none'; sum.style.transform='translateY(0)';
    sum.textContent=h.sum||'';
    card.classList.remove('fade');
    requestAnimationFrame(()=>{
      // si el resumen no cabe, se desplaza lento hacia arriba como leyendo
      const overflow=sum.scrollHeight-wrap.clientHeight;
      let dwell=ROTATE_MS;
      if(overflow>4){
        const secs=overflow/READ_PXPS;
        setTimeout(()=>{ sum.style.transition='transform '+secs+'s linear'; sum.style.transform='translateY(-'+overflow+'px)'; },READ_DELAY);
        dwell=READ_DELAY+secs*1000+2500; // pausa inicial + lectura + pausa final
      }
      rotTimer=setTimeout(()=>{ni++;renderNews();},dwell);
    });
  },450);
}
function buildTicker(){
  const tk=document.getElementById('ticker');
  const parts=[];
  mktTicker.forEach(m=>parts.push(m));
  news.forEach(h=>parts.push(`<span>${esc((h.src||'').toUpperCase())} \u2014 ${esc(h.title)}</span>`));
  tk.innerHTML=parts.join('<span class="sep">\u25c6</span>')||'<span>Riviera Country Club</span>';
  const w=tk.scrollWidth||3000; tk.style.animationDuration=Math.max(45,Math.round(w/TICKER_PXPS))+'s';
}
async function loadNews(){
  const items=await fetchNews();
  news=(items&&items.length)?items:FALLBACK.slice();
  ni=0; renderNews(); buildTicker();
}
loadNews(); setInterval(loadNews,15*60*1000);

/* ===================== MERCADOS (SPY / DIA / QQQ) ===================== */
function marketPhase(){
  const p=new Intl.DateTimeFormat('en-US',{weekday:'short',hour:'numeric',minute:'numeric',hour12:false,timeZone:TZ}).formatToParts(new Date());
  let wd='',h=0,m=0; for(const x of p){ if(x.type==='weekday')wd=x.value; if(x.type==='hour')h=+x.value; if(x.type==='minute')m=+x.value; }
  if(wd==='Sat'||wd==='Sun')return 'closed';
  const t=(h%24)*60+m;
  if(t<570)return 'pre';   // madrugada/mañana antes de 9:30 ET -> mostrar cierre de ayer
  if(t<960)return 'open';  // 9:30–16:00 ET -> en vivo
  return 'closed';         // después del cierre -> mostrar cómo quedó
}
async function quoteFinnhub(sym){
  const r=await fetch(`https://finnhub.io/api/v1/quote?symbol=${sym}&token=${FINNHUB_KEY}`);
  const d=await r.json();
  if(d && typeof d.c==='number' && d.c>0) return {price:d.c, chg:(typeof d.d==='number'?d.d:0), pct:(typeof d.dp==='number'?d.dp:0)};
  return null;
}
async function quoteYahoo(sym){
  const y=`https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=1d&range=5d`;
  for(const p of PROXIES){
    try{
      const r=await fetchT(p+encodeURIComponent(y),8000); let t=await r.text();
      if(t.trim().charAt(0)==='{'&&t.indexOf('"contents"')>-1){try{t=JSON.parse(t).contents||t;}catch(e){}}
      const d=JSON.parse(t); const m=d.chart&&d.chart.result&&d.chart.result[0]&&d.chart.result[0].meta;
      if(m&&m.regularMarketPrice){
        const prev=m.chartPreviousClose||m.previousClose||m.regularMarketPrice;
        const chg=m.regularMarketPrice-prev;
        return {price:m.regularMarketPrice, chg:chg, pct:prev?chg/prev*100:0};
      }
    }catch(e){}
  }
  return null;
}
async function getQuote(sym){
  if(FINNHUB_KEY){ try{ const q=await quoteFinnhub(sym); if(q)return q; }catch(e){} }
  return await quoteYahoo(sym);
}
function fmt(n,dec){ return n.toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
async function loadMarkets(){
  const chip=document.getElementById('mktChip'), chipTxt=document.getElementById('mktChipTxt');
  const phase=marketPhase();
  chip.classList.toggle('open',phase==='open');
  chipTxt.textContent=phase==='open'?'Market open':'Market closed';
  /* Cuando el mercado está cerrado, el precio recibido es el último cierre y el
     cambio corresponde a esa última sesión; el tag aclara qué se está mostrando:
     pre (mañana) -> "Yesterday" · post/fin de semana -> "Closed" · abierto -> en vivo sin tag */
  const tag= phase==='open' ? '' :
    (phase==='pre' ? '<span class="tag">Yesterday</span>' : '<span class="tag">Closed</span>');
  const tkTag= phase==='open' ? '' : (phase==='pre' ? ' (yday)' : ' (close)');
  const grid=document.getElementById('mktGrid');
  const results=await Promise.all(MARKETS.map(m=>getQuote(m.sym).catch(()=>null)));
  mktTicker=[];
  grid.innerHTML=MARKETS.map((m,i)=>{
    const q=results[i];
    if(!q){ return `<div class="mkt-tile"><div class="lbl"><b>${esc(m.label)}</b> · ${esc(m.sym)}</div><div class="px">—</div><div class="chg flat">unavailable</div></div>`; }
    const dir=q.chg>0.001?'up':(q.chg<-0.001?'down':'flat');
    const arrow=dir==='up'?'\u25b2':(dir==='down'?'\u25bc':'\u25cf');
    const sign=q.chg>0?'+':'';
    mktTicker.push(`<span>${esc(m.label)} ${fmt(q.price,2)}${esc(tkTag)} <span class="${dir}">${arrow} ${sign}${fmt(q.pct,2)}%</span></span>`);
    return `<div class="mkt-tile">
      <div class="lbl"><b>${esc(m.label)}</b> · ${esc(m.sym)}</div>
      <div class="px">${fmt(q.price,2)}</div>
      <div class="chg ${dir}">${arrow} ${sign}${fmt(q.chg,2)} (${sign}${fmt(q.pct,2)}%)</div>
      ${tag}
    </div>`;
  }).join('');
  buildTicker();
}
loadMarkets(); setInterval(loadMarkets,5*60*1000);

/* Auto-reload cada 6 h (estabilidad 24/7) */
setTimeout(()=>location.reload(),6*60*60*1000);
